<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: url('assets/bg.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(247, 200, 115, 0.22), transparent 38%),
                  radial-gradient(circle at bottom right, rgba(185, 122, 184, 0.18), transparent 36%),
                  rgba(255, 255, 255, 0.14);
      pointer-events: none;
    }

    .login-box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.9);
      padding: 2.1rem 2rem 1.7rem;
      border-radius: 28px;
      box-shadow: 0 18px 46px rgba(80, 40, 120, 0.12), 0 3px 12px rgba(0, 0, 0, 0.05);
      text-align: center;
      width: min(90vw, 420px);
      border: 1px solid rgba(185, 122, 184, 0.16);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .login-box::before {
      content: "";
      position: absolute;
      top: -70px;
      right: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(247, 200, 115, 0.32) 0%, rgba(185, 122, 184, 0.12) 58%, transparent 74%);
      pointer-events: none;
    }

    .login-box p.message {
      color: #a14d86;
      margin: 0 0 1rem;
      font-weight: bold;
      font-size: 0.98rem;
      letter-spacing: 0.03em;
    }

    .login-box h2 {
      margin: 0 0 0.7rem;
      color: #a14d86;
      font-size: 2rem;
      line-height: 1.1;
    }

    .login-box .subtext {
      margin: 0 0 1.4rem;
      color: #6c5a68;
      line-height: 1.65;
      font-size: 0.96rem;
    }

    #loginForm {
      display: grid;
      gap: 0.9rem;
    }

    .field-group {
      text-align: left;
    }

    .field-group label {
      display: block;
      margin-bottom: 0.38rem;
      color: #7d6477;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .login-box input {
      width: 100%;
      padding: 0.88rem 0.95rem;
      margin: 0;
      border-radius: 14px;
      border: 1px solid rgba(185, 122, 184, 0.18);
      outline: none;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.82);
      color: #5e4a5a;
      box-sizing: border-box;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .login-box input:focus {
      border-color: rgba(185, 122, 184, 0.45);
      box-shadow: 0 0 0 4px rgba(185, 122, 184, 0.12);
    }

    .login-box button {
      background: linear-gradient(135deg, #f9dd8a 0%, #f7c873 55%, #efb94f 100%);
      color: #5e4a5a;
      font-weight: bold;
      font-family: inherit;
      border: none;
      padding: 0.9rem 1.2rem;
      border-radius: 16px;
      cursor: pointer;
      margin-top: 0.35rem;
      box-shadow: 0 10px 22px rgba(247, 200, 115, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .login-box button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(247, 200, 115, 0.34);
      opacity: 0.96;
    }

    .login-actions {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-top: 1rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.82);
      color: #7c5f76;
      padding: 0.78rem 1.2rem;
      border-radius: 14px;
      font-weight: bold;
      font-family: inherit;
      border: 1px solid rgba(185, 122, 184, 0.14);
      box-shadow: 0 8px 18px rgba(80, 40, 120, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(80, 40, 120, 0.1);
    }

    .footer-note {
      margin-top: 0.2rem;
      font-size: 0.85rem;
      color: #8a7485;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @media (max-width: 540px) {
      .login-box {
        padding: 1.8rem 1.2rem 1.4rem;
        border-radius: 22px;
      }

      .login-box h2 {
        font-size: 1.7rem;
      }

      .login-box .subtext {
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-box">
    <p class="message">🌸 To post stories, please login first</p>
    <h2>Admin Login</h2>
    <p class="subtext">Enter your admin details to open the studio and publish new stories.</p>
    <form id="loginForm">
      <div class="field-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required />
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>
      <button type="submit">Login</button>
    </form>

    <div class="login-actions">
      <a href="index.html" class="back-btn">← Go Back</a>
      <div class="footer-note">Admin Panel</div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          // ✅ Redirect to admin page in admin folder
          window.location.href = 'admin/admin.html';
        } else {
          alert('❌ Invalid username or password!');
        }
      } catch (err) {
        alert('⚠️ Server error. Please try again later.');
      }
    });
  </script>
</body>
</html>
